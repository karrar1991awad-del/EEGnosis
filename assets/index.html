<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧠 EEGnosis - Atlas Practice</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            max-height: 100vh;
            max-width: 100vw;
            overflow: hidden;
            background: #090d16;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            width: 100vw;
            height: 100vh;
            background: #090d16;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #111827;
            border-bottom: 1px solid #1f293d;
            flex-shrink: 0;
        }
        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f3f4f6;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .app-brand span {
            font-size: 1.3rem;
        }

        /* Image Viewport & Framing */
        .card-media-col {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            padding: 16px; /* Margin around the image frame */
            overflow: hidden;
            position: relative;
        }
        
        .img-frame {
            width: 100%;
            height: 100%;
            max-width: 96%;
            max-height: 96%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            border-radius: 16px;
            border: 1px solid #1f293d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 8px; /* Inner margin */
            overflow: hidden;
            position: relative;
        }

        .figure-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Caption Overlay */
        .caption-box {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #2a7de1;
            padding: 12px 16px;
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 0.9rem;
            line-height: 1.4;
            max-height: 35vh;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .caption-box.show { display: block; }

        /* Bottom Controls Bar */
        .bottom-controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            background: #111827;
            border-top: 1px solid #1f293d;
            flex-shrink: 0;
            width: 100%;
            z-index: 20;
        }

        .filter-group select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #e5e7eb;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            max-width: 220px;
        }

        .action-buttons {
            display: flex;
            flex-direction: row;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .btn-toggle-caption { background: #2563eb; color: white; }
        .btn-toggle-caption:hover { background: #1d4ed8; }
        
        .btn-recognized { background: #16a34a; color: white; }
        .btn-recognized:hover { background: #15803d; }
        
        .btn-again { background: #d97706; color: white; }
        .btn-again:hover { background: #b45309; }

        .nav-btn {
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-btn:hover:not(:disabled) { background: #374151; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @media (max-width: 768px) {
            .bottom-controls {
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px;
            }
            .filter-group select {
                max-width: 100%;
                width: 100%;
            }
            .action-buttons {
                width: 100%;
            }
            .action-btn, .nav-btn {
                flex: 1;
                padding: 8px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Top Header Bar -->
    <div class="top-bar">
        <div class="app-brand">
            <span>🧠</span> EEGnosis Atlas
        </div>
    </div>

    <!-- Image Viewport with Frame -->
    <div class="card-media-col">
        <div class="img-frame">
            <img id="figureImg" class="figure-img" src="" alt="EEG Trace">
            <div id="captionBox" class="caption-box"></div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">⬅ Prev</button>

        <div class="action-buttons">
            <button id="toggleCaptionBtn" class="action-btn btn-toggle-caption" onclick="toggleCaption()">📖 Caption</button>
            <button class="action-btn btn-recognized" onclick="markRecognized()">✅ Recognized</button>
            <button class="action-btn btn-again" onclick="markAgain()">🔁 Again</button>
        </div>

        <div class="filter-group">
            <select id="sectionFilter">
                <option value="ALL">All Sections</option>
                <option value="Normal and Benign Variants">1. Normal & Benign Variants</option>
                <option value="Artifacts">2. Artifacts</option>
                <option value="Newborn">3. Newborn</option>
                <option value="Focal Nonepileptiform Activity">4. Focal Nonepileptiform</option>
                <option value="Generalized Nonepileptiform Activity">5. Generalized Nonepileptiform</option>
                <option value="ICU">6. ICU</option>
                <option value="Epileptic Encephalopathy">7. Epileptic Encephalopathy</option>
                <option value="Generalized Epilepsy">8. Generalized Epilepsy</option>
                <option value="Focal Epilepsy">9. Focal Epilepsy</option>
            </select>
        </div>

        <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Next ➡</button>
    </div>
</div>

<script>
    const START_INDEX = 3;
    const END_INDEX = 768;

    let ALL_DATA = [];
    let filteredData = [];
    let currentIndex = 0;
    let isCaptionShown = false;

    function initData() {
        ALL_DATA = [];
        for (let i = START_INDEX; i <= END_INDEX; i++) {
            const numStr = String(i).padStart(3, '0');
            const idStr = `figure_${numStr}`;
            ALL_DATA.push({
                id: i,
                image: `${idStr}.jpg`,
                txtFile: `${idStr}.txt`,
                section: 'General'
            });
        }

        fetch('sections.json')
            .then(r => r.ok ? r.json() : null)
            .then(map => {
                if (map) {
                    ALL_DATA.forEach(d => {
                        const key = `figure_${String(d.id).padStart(3, '0')}`;
                        if (map[key]) d.section = map[key];
                    });
                }
                applyFilter();
            }).catch(() => applyFilter());
    }

    function applyFilter() {
        const val = document.getElementById('sectionFilter').value;
        if (val === 'ALL') {
            filteredData = [...ALL_DATA];
        } else {
            filteredData = ALL_DATA.filter(d => d.section === val);
        }
        currentIndex = 0;
        renderCard();
    }

    async function fetchCaption(txtFile) {
        try {
            const r = await fetch(txtFile);
            if (r.ok) return (await r.text()).trim();
        } catch(e){}
        return "No caption available.";
    }

    async function renderCard() {
        if (filteredData.length === 0) return;

        const item = filteredData[currentIndex];

        const img = document.getElementById('figureImg');
        img.src = item.image;

        isCaptionShown = false;
        const captionBox = document.getElementById('captionBox');
        captionBox.classList.remove('show');
        document.getElementById('toggleCaptionBtn').textContent = '📖 Caption';
        captionBox.textContent = 'Loading...';

        fetchCaption(item.txtFile).then(text => captionBox.textContent = text);

        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === filteredData.length - 1;
    }

    function toggleCaption() {
        isCaptionShown = !isCaptionShown;
        const box = document.getElementById('captionBox');
        const btn = document.getElementById('toggleCaptionBtn');
        if (isCaptionShown) {
            box.classList.add('show');
            btn.textContent = '🙈 Hide';
        } else {
            box.classList.remove('show');
            btn.textContent = '📖 Caption';
        }
    }

    function markRecognized() {
        navigate(1);
    }

    function markAgain() {
        navigate(1);
    }

    function navigate(step) {
        if (currentIndex + step >= 0 && currentIndex + step < filteredData.length) {
            currentIndex += step;
            renderCard();
        }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === ' ') {
            e.preventDefault();
            toggleCaption();
        }
    });

    document.getElementById('sectionFilter').addEventListener('change', applyFilter);

    initData();
</script>
</body>
</html>
