name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev aidl

      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython<3.0"
          pip list

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build with Buildozer (verbose)
        id: build_step
        continue-on-error: true
        run: |
          set +e
          yes | buildozer -v android debug > buildozer_full.log 2>&1
          echo "BUILDOZER_EXIT_CODE=$?" >> $GITHUB_ENV
          set -e

      - name: Show tail of buildozer log
        if: always()
        run: |
          echo "=============== LAST 300 LINES ==============="
          tail -n 300 buildozer_full.log

      - name: Search for critical errors in log
        if: always()
        run: |
          echo "=============== ERROR LINES ==============="
          grep -n -i -E "error:|ERROR:|failed|FAILED|Exception|Traceback|No such file|Could not find|not found|denied|Command failed" buildozer_full.log | tail -n 80 || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_full.log
          retention-days: 30

      - name: Upload APK
        if: env.BUILDOZER_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: eegnosis-apk
          path: bin/*.apk
          retention-days: 30
